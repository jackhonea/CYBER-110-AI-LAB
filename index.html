<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostalgia Time Capsule (1980 - 2020)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .font-pixel { font-family: 'Press Start 2P', monospace; }
        .font-mono-retro { font-family: 'VT323', monospace; }
        .crt-scanline::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 50;
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen selection:bg-pink-500 selection:text-white">
    <div id="app" class="p-4 md:p-8 max-w-5xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="font-pixel text-2xl md:text-4xl text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 mb-2">
                Nostalgia Time Capsule
            </h1>
            <p class="text-gray-400 font-mono-retro text-2xl">Select a year to travel through pop culture history</p>
        </header>

        <!-- Year Selector Tabs -->
        <div class="flex flex-wrap justify-center gap-2 mb-8">
            <button onclick="setYear(1980)" id="btn-1980" class="px-4 py-2 font-pixel text-xs rounded border border-cyan-500 transition-all">1980</button>
            <button onclick="setYear(1985)" id="btn-1985" class="px-4 py-2 font-pixel text-xs rounded border border-cyan-500 transition-all">1985</button>
            <button onclick="setYear(1990)" id="btn-1990" class="px-4 py-2 font-pixel text-xs rounded border border-cyan-500 transition-all">1990</button>
            <button onclick="setYear(1995)" id="btn-1995" class="px-4 py-2 font-pixel text-xs rounded border border-cyan-500 transition-all">1995</button>
            <button onclick="setYear(2000)" id="btn-2000" class="px-4 py-2 font-pixel text-xs rounded border border-cyan-500 transition-all">2000</button>
            <button onclick="setYear(2005)" id="btn-2005" class="px-4 py-2 font-pixel text-xs rounded border border-cyan-500 transition-all">2005</button>
            <button onclick="setYear(2010)" id="btn-2010" class="px-4 py-2 font-pixel text-xs rounded border border-cyan-500 transition-all">2010</button>
            <button onclick="setYear(2015)" id="btn-2015" class="px-4 py-2 font-pixel text-xs rounded border border-cyan-500 transition-all">2015</button>
            <button onclick="setYear(2020)" id="btn-2020" class="px-4 py-2 font-pixel text-xs rounded border border-cyan-500 transition-all">2020</button>
        </div>

        <!-- Content Area -->
        <div id="content-container" class="bg-gray-900 border-2 border-cyan-500/50 rounded-xl p-6 shadow-2xl relative overflow-hidden">
            <!-- Dynamic content injected via script -->
        </div>
    </div>

    <script>
        const data = {
            1980: { title: "The Dawn of Arcade Fever", theme: "from-cyan-900 to-blue-950", game: "Pac-Man & Battlezone", song: "Call Me - Blondie", tech: "Sony Walkman & Rubik's Cube", news: "Mount St. Helens erupts & US boycotts Moscow Olympics." },
            1985: { title: "Neon, Synths & Blockbusters", theme: "from-purple-900 to-indigo-950", game: "Super Mario Bros. & Tetris", song: "Take On Me - a-ha", tech: "NES & Windows 1.0", news: "Live Aid concerts held globally & Nintendo Entertainment System launches in US." },
            1990: { title: "16-Bit Wars & Alternative Rock", theme: "from-pink-900 to-purple-950", game: "Sonic the Hedgehog & Super Mario World", song: "Vogue - Madonna", tech: "World Wide Web invented & SNES", news: "Hubble Space Telescope deployed & Germany reunified." },
            1995: { title: "Dial-up Internet & Windows 95", theme: "from-blue-900 to-slate-950", game: "PlayStation launch & Chrono Trigger", song: "Waterfalls - TLC", tech: "Windows 95 & AIM", news: "Toy Story premieres as first fully CGI feature film." },
            2000: { title: "Y2K Panic & The Millennial Turn", theme: "from-emerald-900 to-teal-950", game: "The Sims & Diablo II", song: "Oops!... I Did It Again - Britney Spears", tech: "Nokia 3310 & Napster", news: "International Space Station welcomes its first permanent crew." },
            2005: { title: "MySpace, iPods & YouTube Era", theme: "from-orange-900 to-red-950", game: "World of Warcraft & Guitar Hero", song: "We Belong Together - Mariah Carey", tech: "YouTube founded & iPod Nano", news: "First-ever YouTube video 'Me at the zoo' is uploaded." },
            2010: { title: "The App Store & Social Boom", theme: "from-sky-900 to-blue-950", game: "Minecraft & Angry Birds", song: "Love the Way You Lie - Eminem ft. Rihanna", tech: "iPad & Instagram launch", news: "Instagram launches, changing mobile photography forever." },
            2015: { title: "Streaming Culture & Smart Ecosystems", theme: "from-violet-900 to-fuchsia-950", game: "The Witcher 3 & Fallout 4", song: "Uptown Funk - Mark Ronson ft. Bruno Mars", tech: "Apple Watch & AirPods announcement", news: "NASA's New Horizons spacecraft flies past Pluto." },
            2020: { title: "Remote Life & Next-Gen Gaming", theme: "from-zinc-900 to-neutral-950", game: "Animal Crossing: New Horizons & Cyberpunk 2077", song: "Blinding Lights - The Weeknd", tech: "PS5, Xbox Series X & Zoom boom", news: "Global lockdowns redefine remote work, education, and digital connection." }
        };

        function setYear(year) {
            // Update button styles
            document.querySelectorAll('[id^="btn-"]').forEach(btn => {
                btn.className = "px-4 py-2 font-pixel text-xs rounded border border-cyan-500/40 text-cyan-400 hover:bg-cyan-500/20 transition-all";
            });
            const activeBtn = document.getElementById(`btn-${year}`);
            activeBtn.className = "px-4 py-2 font-pixel text-xs rounded bg-cyan-500 text-gray-950 font-bold shadow-lg shadow-cyan-500/50";

            const info = data[year];
            const container = document.getElementById('content-container');
            container.className = `bg-gradient-to-br ${info.theme} border-2 border-cyan-400 rounded-xl p-6 shadow-2xl relative overflow-hidden`;

            container.innerHTML = `
                <div class="absolute top-2 right-4 font-mono-retro text-6xl text-cyan-500/20 pointer-events-none">${year}</div>
                <h2 class="font-pixel text-lg md:text-2xl text-cyan-300 mb-4">${year}: ${info.title}</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 font-mono-retro text-xl">
                    <div class="bg-gray-950/60 p-4 rounded border border-cyan-500/30">
                        <span class="text-pink-400 font-bold">🎮 Iconic Game:</span> ${info.game}
                    </div>
                    <div class="bg-gray-950/60 p-4 rounded border border-cyan-500/30">
                        <span class="text-purple-400 font-bold">🎵 Hit Anthem:</span> ${info.song}
                    </div>
                    <div class="bg-gray-950/60 p-4 rounded border border-cyan-500/30">
                        <span class="text-cyan-400 font-bold">⚡ Tech & Gadgets:</span> ${info.tech}
                    </div>
                    <div class="bg-gray-950/60 p-4 rounded border border-cyan-500/30">
                        <span class="text-yellow-400 font-bold">📰 Flashback News:</span> ${info.news}
                    </div>
                </div>
            `;
        }

        // Initialize with 1995 on load
        setYear(1995);
    </script>
</body>
</html>
